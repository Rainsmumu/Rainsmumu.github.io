<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>林予典 Yudian Lin</title>
  <meta name="description" content="林予典 (Yudian Lin) 的个人主页 · 网络工程师 · AI Agent 开发者" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <div class="topbar">
    <button class="tb-btn" id="langBtn" aria-label="Switch language" title="L">EN</button>
    <button class="tb-btn" id="themeBtn" aria-label="Toggle theme" title="T">
      <svg class="i-sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></g></svg>
      <svg class="i-moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
    </button>
  </div>

  <div class="layout">
    <aside class="side">
      <div class="avatar" id="avatar" tabindex="0"><span class="hi" data-t="hi"></span></div>
      <h1 class="name" data-k="name"></h1>
      <div class="alt-name" data-k="altName"></div>
      <p class="title" data-k="title"></p>
      <p class="meta"><span data-k="affiliation"></span><br /><span data-k="location"></span></p>
      <p class="now" id="now"><i class="dot"></i><span></span></p>
      <ul class="links" id="links"></ul>
      <button class="cv-btn" id="printBtn"><span data-t="cv"></span><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 4v12m0 0-5-5m5 5 5-5M5 20h14"/></svg></button>
      <nav class="toc" id="toc"><span class="toc-bar" id="tocBar"></span></nav>
    </aside>

    <main class="content" id="content">
      <section id="about">
        <h2><span data-t="sec.about"></span><small class="readtime" id="readtime"></small></h2>
        <div id="aboutText" class="prose"></div>
        <ul class="interests" id="interests"></ul>
      </section>

      <section id="news">
        <h2 data-t="sec.news"></h2>
        <ul class="news" id="newsList"></ul>
      </section>

      <section id="publications">
        <h2 data-t="sec.pubs"></h2>
        <ol class="pubs" id="pubList"></ol>
      </section>

      <section id="projects">
        <h2 data-t="sec.projects"></h2>
        <ul class="projects" id="projectList"></ul>
      </section>

      <section id="experience">
        <h2 data-t="sec.exp"></h2>
        <ul class="rows" id="expList"></ul>
      </section>

      <section id="education">
        <h2 data-t="sec.edu"></h2>
        <ul class="rows" id="eduList"></ul>
      </section>

      <section id="skills">
        <h2 data-t="sec.skills"></h2>
        <dl class="skills" id="skillList"></dl>
      </section>

      <div class="clap-wrap">
        <button class="clap" id="clap" aria-label="Clap">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M8.6 10.8 6.4 8.6a1.3 1.3 0 0 1 1.8-1.8l4.6 4.6M10 9.3 7.7 7a1.3 1.3 0 0 1 1.8-1.8l5 5M12.6 8.6l-1.4-1.4A1.3 1.3 0 0 1 13 5.4l4 4c1.9 1.9 1.9 5.1 0 7l-.5.5a5 5 0 0 1-7 0l-4.3-4.3a1.3 1.3 0 0 1 1.8-1.8l2.3 2.3M15 3.5l.5-1.5M18 5l1.2-1M19 8h1.5"/></svg>
          <span class="burst" id="burst"></span>
        </button>
        <span class="clap-text" id="clapText"></span>
      </div>

      <footer class="footer">
        <span>© <span id="year"></span> <span data-k="name"></span> · <span id="updated"></span></span>
        <span class="keys"><kbd>T</kbd> <span data-t="k.theme"></span> <kbd>L</kbd> <span data-t="k.lang"></span> <a href="#top" id="toTop">↑ <span data-t="top"></span></a></span>
      </footer>
    </main>
  </div>

  <div class="quote-pop" id="quotePop" hidden><span data-t="quote"></span></div>
  <div class="toast" id="toast" role="status"></div>

  <!-- 打印用简历:点「下载简历」时只打印这一块 -->
  <article class="print-resume" id="printResume"></article>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
